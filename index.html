<title>Ferro Precision — Machined to run true</title> <style> :root{ --navy:#101E2E; --navy-deep:#0B1621; --paper:#EFEAE0; --paper-dim:#E6E0D2; --ink:#16222E; --ink-soft:#4A5A68; --copper:#B8703C; --copper-light:#D89A6A; --line-on-paper: rgba(22,34,46,0.16); --line-on-navy: rgba(216,154,106,0.22); --grid-on-navy: rgba(216,154,106,0.08); } *{box-sizing:border-box;} html{scroll-behavior:smooth;} body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; } h1,h2,h3{ font-family:'Fraunces', serif; font-weight:500; line-height:1.08; margin:0; color:var(--ink); letter-spacing:-0.01em; } a{color:inherit;} .wrap{max-width:1140px; margin:0 auto; padding:0 28px;} .mono{font-family:'IBM Plex Mono', monospace;} :focus-visible{outline:2px solid var(--copper); outline-offset:3px;}
/* ---------- header ---------- */ .site-header{ position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:1px solid var(--line-on-paper); } .header-inner{ display:flex; align-items:center; justify-content:space-between; height:72px; } .logo{ font-family:'Fraunces', serif; font-weight:600; font-size:1.35rem; text-decoration:none; display:flex; align-items:center; gap:4px; color:var(--ink); } .logo-mark{color:var(--copper); font-family:'IBM Plex Mono', monospace; font-size:1.05rem;} .main-nav{display:flex; gap:32px;} .main-nav a{ text-decoration:none; font-family:'IBM Plex Mono', monospace; font-size:0.86rem; color:var(--ink-soft); border-bottom:1px solid transparent; padding-bottom:2px; transition:color .15s, border-color .15s; } .main-nav a:hover{color:var(--copper); border-color:var(--copper);} .header-actions{display:flex; gap:12px; align-items:center;} .nav-toggle{display:none;}

/* ---------- buttons ---------- */ .btn{ font-family:'IBM Plex Mono', monospace; font-size:0.85rem; padding:11px 20px; text-decoration:none; display:inline-block; border:1px solid var(--ink); border-radius:2px; transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease; } .btn-solid{background:var(--copper); border-color:var(--copper); color:var(--paper);} .btn-solid:hover{background:var(--ink); border-color:var(--ink);} .btn-ghost{border-color:transparent; color:var(--ink-soft);} .btn-ghost:hover{color:var(--copper);} .btn-outline{border-color:var(--ink); color:var(--ink); background:transparent;} .btn-outline:hover{border-color:var(--copper); color:var(--copper);} .btn:active{transform:translateY(1px);} .hero .btn-outline{border-color:var(--paper); color:var(--paper);} .hero .btn-outline:hover{border-color:var(--copper-light); color:var(--copper-light);}

/* ---------- hero ---------- */ .hero{ background: linear-gradient(var(--grid-on-navy) 1px, transparent 1px) 0 0/40px 40px, linear-gradient(90deg, var(--grid-on-navy) 1px, transparent 1px) 0 0/40px 40px, var(--navy); color:var(--paper); padding:76px 0 0; } .hero-inner{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:40px; align-items:center; padding-bottom:64px; } .kicker{ font-family:'IBM Plex Mono', monospace; font-size:0.82rem; color:var(--copper-light); margin:0 0 18px; letter-spacing:0.01em; } .hero h1{font-size:clamp(2.3rem, 4.4vw, 3.6rem); color:var(--paper); max-width:11ch;} .hero .lede{ color:#C6CFD8; max-width:46ch; margin:22px 0 32px; font-size:1.03rem; } .hero-ctas{display:flex; gap:14px; flex-wrap:wrap;} .hero-figure svg{width:100%; height:auto; display:block;} .draw-path{ stroke-dasharray:900; stroke-dashoffset:900; animation:draw 2.1s ease forwards .2s; } @keyframes draw{ to{ stroke-dashoffset:0; } } @media (prefers-reduced-motion: reduce){ .draw-path{ animation:none; stroke-dashoffset:0; } }

.spec-row{ display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line-on-navy); } .spec-item{ padding:22px 24px; border-right:1px solid var(--line-on-navy); } .spec-item:last-child{border-right:none;} .spec-num{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:1.7rem; color:var(--copper-light); display:block; } .spec-label{ font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:#9BA9B6; margin-top:4px; display:block; }

/* ---------- section shell ---------- */ section{padding:88px 0;} .section-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:48px; border-bottom:1px solid var(--line-on-paper); padding-bottom:22px; } .section-head h2{font-size:clamp(1.7rem, 3vw, 2.3rem);} .section-tag{ font-family:'IBM Plex Mono', monospace; font-size:0.82rem; color:var(--copper); white-space:nowrap; }

/* ---------- process ---------- */ .process{background:var(--paper-dim);} .process-steps{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,1fr); gap:0; } .process-steps li{ padding:0 22px 0 0; border-left:1px solid var(--line-on-paper); padding-left:22px; } .process-steps li:first-child{border-left:none; padding-left:0;} .step-no{ font-family:'IBM Plex Mono', monospace; color:var(--copper); font-size:0.95rem; display:block; margin-bottom:14px; } .process-steps h3{font-size:1.15rem; margin-bottom:10px;} .process-steps p{color:var(--ink-soft); font-size:0.94rem; margin:0;}

/* ---------- tech panel (cards without rounded/shadow cliche) ---------- */ .tech-panel{ position:relative; border:1px solid var(--line-on-paper); padding:26px; } .tech-panel::before, .tech-panel::after, .tech-panel .tick-br, .tech-panel .tick-bl{ content:""; position:absolute; width:11px; height:11px; pointer-events:none; } .tech-panel::before{ top:-1px; left:-1px; border-top:2px solid var(--copper); border-left:2px solid var(--copper); } .tech-panel::after{ top:-1px; right:-1px; border-top:2px solid var(--copper); border-right:2px solid var(--copper); } .tick-bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--copper); border-left:2px solid var(--copper); } .tick-br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--copper); border-right:2px solid var(--copper); }

/* ---------- products ---------- */ .product-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; } .product-name{font-size:1.25rem; margin-bottom:4px;} .product-sub{color:var(--ink-soft); font-size:0.88rem; margin:0 0 18px;} .spec-table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:0.82rem; margin-bottom:20px;} .spec-table tr{border-top:1px solid var(--line-on-paper);} .spec-table tr:first-child{border-top:none;} .spec-table td{padding:8px 0; color:var(--ink-soft);} .spec-table td:last-child{text-align:right; color:var(--ink);} .product-price{ font-family:'Fraunces', serif; font-style:italic; font-size:1.3rem; margin-bottom:16px; display:block; } .product-cta{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; text-decoration:none; color:var(--copper); border-bottom:1px solid var(--copper); padding-bottom:2px; } .product-cta:hover{color:var(--ink); border-color:var(--ink);}

/* ---------- about / quote ---------- */ .about{ background:var(--navy); color:var(--paper); } .quote-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; } blockquote{ margin:0; font-family:'Fraunces', serif; font-size:clamp(1.4rem,2.4vw,1.9rem); line-height:1.4; font-weight:500; } .quote-attr{ margin-top:22px; font-family:'IBM Plex Mono', monospace; font-size:0.84rem; color:var(--copper-light); } .about-figure{border:1px solid var(--line-on-navy); padding:28px;} .about-figure p{color:#C6CFD8; font-size:0.94rem; margin:0 0 14px;} .about-figure p:last-child{margin-bottom:0;} .about-figure strong{color:var(--paper); font-weight:600;}

/* ---------- footer ---------- */ footer{ background:var(--navy-deep); color:#8FA0AD; padding:56px 0 28px; } .footer-top{ display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:40px; padding-bottom:40px; border-bottom:1px solid var(--line-on-navy); } .footer-top h4{ font-family:'IBM Plex Mono', monospace; color:var(--copper-light); font-size:0.82rem; margin:0 0 16px; font-weight:400; } .footer-top p{margin:0 0 8px; font-size:0.9rem;} .footer-top a{text-decoration:none; color:#8FA0AD; display:block; margin-bottom:8px; font-size:0.9rem;} .footer-top a:hover{color:var(--copper-light);} .footer-bottom{ display:flex; justify-content:space-between; padding-top:22px; font-family:'IBM Plex Mono', monospace; font-size:0.78rem; }

@media (max-width: 860px){ .hero-inner{grid-template-columns:1fr;} .hero-figure{order:-1;} .spec-row{grid-template-columns:repeat(2,1fr);} .spec-item:nth-child(2){border-right:none;} .process-steps{grid-template-columns:1fr 1fr; row-gap:32px;} .process-steps li:nth-child(3){border-left:none; padding-left:0;} .product-grid{grid-template-columns:1fr;} .quote-wrap{grid-template-columns:1fr;} .footer-top{grid-template-columns:1fr; gap:28px;} .main-nav{display:none;} } </style>
